name: Fork Desktop Installers

on:
  push:
    branches: [fork-release/macos-arm64-fallback]

permissions:
  contents: read
  packages: read

jobs:
  package:
    if: github.repository == 'js2me/paseo'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            target: --mac dmg --arm64 -c.mac.notarize=false -c.mac.identity=- -c.mac.hardenedRuntime=false
            heap: 4096
            assets: packages/desktop/release/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=${{ matrix.heap }}
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          TARGET: ${{ matrix.target }}
        run: |
          read -r -a target <<< "$TARGET"
          npm run build:desktop -- "${target[@]}" --publish never -c.publish.releaseType=prerelease -c.publish.channel=beta
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
